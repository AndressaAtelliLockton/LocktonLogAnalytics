clone:
    lfs: true

image:
  name: dckr-reg.lockton.com.br/builderimage:main
  username: $REG_USER
  password: $REG_P

definitions:
  services:
    docker:
      memory: 3072

pipelines:
    pull-requests: # Apenas valida se o merge e a build vão funcionar.
        '**':
            - step:
                name: Build Test Only
                runs-on: locktonbrasilrunner
                script:
                    - export BITBUCKET_COMMIT_SHORT="${BITBUCKET_COMMIT::7}"
                    - sed -i 's|YYZ|'$BITBUCKET_COMMIT_SHORT'|g' Dockerfile
                    - docker build -t dckr-reg.lockton.com.br/$PROJECT_NAME:$BITBUCKET_COMMIT_SHORT --build-arg ENV=dev .
                services:
                    - docker
    branches:
        staging:
            - step:
                name: Publish Staging
                deployment: staging
                runs-on: locktonbrasilrunner
                script:
                    - export BITBUCKET_COMMIT_SHORT="${BITBUCKET_COMMIT::7}"
                    - sed -i 's|YYZ|'$BITBUCKET_COMMIT_SHORT'|g' Dockerfile
                    - IMAGE_TAG=$(/builderbin/gettag.sh "$BITBUCKET_BRANCH" "$BITBUCKET_COMMIT" "staging")
                    - echo "$REG_P" | docker login dckr-reg.lockton.com.br --username $REG_USER --password-stdin
                    - docker build -t dckr-reg.lockton.com.br/$PROJECT_NAME:$IMAGE_TAG --build-arg ENV=homolog .
                    - docker push dckr-reg.lockton.com.br/$PROJECT_NAME:$IMAGE_TAG
                    - ansible dockerswarm1hom -i /ansibledefs/hosts -a "docker login dckr-reg.lockton.com.br --username $REG_USER --password $REG_P"
                    - ansible dockerswarm1hom -i /ansibledefs/hosts -a "docker service update \
                        --force \
                        --restart-condition any \
                        --with-registry-auth \
                        --image dckr-reg.lockton.com.br/$PROJECT_NAME:$IMAGE_TAG \
                        --env-add GRAYLOG_API_URL=\"$GRAYLOG_API_URL\" \
                        --env-add GRAYLOG_USER=\"$GRAYLOG_USER\" \
                        --env-add GRAYLOG_PASSWORD=\"$GRAYLOG_PASSWORD\" \
                        --env-add GROQ_API_KEY=\"$GROQ_API_KEY\" \
                        --env-add JIRA_WEBHOOK_URL=\"$JIRA_WEBHOOK_URL\" \
                        --env-add JIRA_API_KEY=\"$JIRA_API_KEY\" \
                        --env-add TEAMS_WEBHOOK_URL=\"$TEAMS_WEBHOOK_URL\" \
                        --env-add DASHBOARD_URL=\"$DASHBOARD_URL\" \
                        --env-add WATCHDOG_SOURCES=\"$WATCHDOG_SOURCES\" \
                        --env-add INFLUXDB_URL=\"$INFLUXDB_URL\" \
                        --env-add DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=\"$DOCKER_INFLUXDB_INIT_ADMIN_TOKEN\" \
                        --env-add DOCKER_INFLUXDB_INIT_ORG=\"$DOCKER_INFLUXDB_INIT_ORG\" \
                        --env-add DOCKER_INFLUXDB_INIT_BUCKET=\"$DOCKER_INFLUXDB_INIT_BUCKET\" \
                        $PROJECT_NAME-staging"
                services:
                    - docker
    custom:
        createstaging:
            - step:
                name: Create Staging Container
                deployment: staging
                runs-on: locktonbrasilrunner
                script:
                    - export BITBUCKET_COMMIT_SHORT="${BITBUCKET_COMMIT::7}"
                    - sed -i 's|YYZ|'$BITBUCKET_COMMIT_SHORT'|g' Dockerfile
                    - IMAGE_TAG=$(/builderbin/gettag.sh "$BITBUCKET_BRANCH" "$BITBUCKET_COMMIT" "staging")
                    - echo "$REG_P" | docker login dckr-reg.lockton.com.br --username $REG_USER --password-stdin
                    - docker build -t dckr-reg.lockton.com.br/$PROJECT_NAME:$IMAGE_TAG --build-arg ENV=homolog .
                    - docker push dckr-reg.lockton.com.br/$PROJECT_NAME:$IMAGE_TAG
                    - ansible dockerswarm1hom -i /ansibledefs/hosts -a "docker login dckr-reg.lockton.com.br --username $REG_USER --password $REG_P"
                    - ansible dockerswarm1hom -i /ansibledefs/hosts -m shell -a "docker service rm $PROJECT_NAME-staging || true"
                    - ansible dockerswarm1hom -i /ansibledefs/hosts -a "docker service create -d \
                        --restart-condition any \
                        --publish target=80,published=$PROJECT_PORT \
                        --log-driver=gelf --log-opt gelf-address=udp://logserver.lockton.com.br:12201 --log-opt tag=$PROJECT_NAME-staging \
                        --with-registry-auth \
                        --name $PROJECT_NAME-staging \
                        -e GRAYLOG_API_URL=\"$GRAYLOG_API_URL\" \
                        -e GRAYLOG_USER=\"$GRAYLOG_USER\" \
                        -e GRAYLOG_PASSWORD=\"$GRAYLOG_PASSWORD\" \
                        -e GROQ_API_KEY=\"$GROQ_API_KEY\" \
                        -e JIRA_WEBHOOK_URL=\"$JIRA_WEBHOOK_URL\" \
                        -e JIRA_API_KEY=\"$JIRA_API_KEY\" \
                        -e TEAMS_WEBHOOK_URL=\"$TEAMS_WEBHOOK_URL\" \
                        -e DASHBOARD_URL=\"$DASHBOARD_URL\" \
                        -e WATCHDOG_SOURCES=\"$WATCHDOG_SOURCES\" \
                        -e INFLUXDB_URL=\"$INFLUXDB_URL\" \
                        -e DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=\"$DOCKER_INFLUXDB_INIT_ADMIN_TOKEN\" \
                        -e DOCKER_INFLUXDB_INIT_ORG=\"$DOCKER_INFLUXDB_INIT_ORG\" \
                        -e DOCKER_INFLUXDB_INIT_BUCKET=\"$DOCKER_INFLUXDB_INIT_BUCKET\" \
                        dckr-reg.lockton.com.br/$PROJECT_NAME:$IMAGE_TAG"
                services:
                    - docker
