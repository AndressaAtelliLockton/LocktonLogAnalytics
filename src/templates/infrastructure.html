<div id="infrastructure-page" class="page-section" style="display: none;">
    <!-- KPIs -->
    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-6 mb-6">
        <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
            <h4 class="text-sm font-medium text-slate-500 dark:text-slate-400 uppercase">Nós Ativos</h4>
            <p id="infra-kpi-nodes" class="text-3xl font-bold text-slate-800 dark:text-slate-100 mt-2">--</p>
        </div>
        <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
            <h4 class="text-sm font-medium text-slate-500 dark:text-slate-400 uppercase">Status Geral</h4>
            <p id="infra-kpi-status" class="text-3xl font-bold text-slate-800 dark:text-slate-100 mt-2">--</p>
        </div>
        <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
            <div class="flex items-center gap-1">
                <h4 class="text-sm font-medium text-slate-500 dark:text-slate-400 uppercase">Journal (Fila)</h4>
                <div class="relative group cursor-pointer">
                    <i data-lucide="info" class="w-4 h-4 text-slate-400 hover:text-blue-500 transition-colors"></i>
                    <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 hidden group-hover:block w-64 p-2 bg-slate-800 text-white text-xs rounded-lg shadow-xl z-[100] pointer-events-none font-normal text-center leading-relaxed normal-case">
                        O número que aparece representa a quantidade exata de mensagens que estão presas na fila esperando para serem processadas.
                        <div class="absolute top-full left-1/2 -translate-x-1/2 border-4 border-transparent border-t-slate-800"></div>
                    </div>
                </div>
            </div>
            <p id="infra-kpi-journal" class="text-3xl font-bold text-slate-800 dark:text-slate-100 mt-2">--</p>
        </div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- CPU Usage -->
        <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
            <h4 class="text-lg font-semibold text-slate-800 dark:text-slate-100 mb-4">Uso de CPU (%)</h4>
            <div class="h-72 relative">
                <canvas id="infra-cpu-chart"></canvas>
            </div>
        </div>

        <!-- Memory Usage -->
        <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
            <h4 class="text-lg font-semibold text-slate-800 dark:text-slate-100 mb-4">Uso de Memória (%)</h4>
            <div class="h-72 relative">
                <canvas id="infra-mem-chart"></canvas>
            </div>
        </div>

        <!-- Disk Usage -->
        <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
            <h4 class="text-lg font-semibold text-slate-800 dark:text-slate-100 mb-4">Uso de Disco (%)</h4>
            <div class="h-72 relative">
                <canvas id="infra-disk-chart"></canvas>
            </div>
        </div>
    </div>
</div>
