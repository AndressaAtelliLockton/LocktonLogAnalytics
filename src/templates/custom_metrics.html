<div id="custom-metrics-page" class="page-section" style="display: none;">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Coluna de Criação e Teste -->
        <div class="space-y-6">
            <!-- Card de Criação -->
            <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
                <h4 class="text-lg font-semibold text-slate-800 dark:text-slate-100 mb-4">Criar Nova Métrica</h4>
                <div class="space-y-4">
                    <div>
                        <label for="metric-name" class="text-sm font-medium text-slate-600 dark:text-slate-300">Nome da Métrica</label>
                        <input type="text" id="metric-name" placeholder="Ex: Tempo de Resposta API" class="mt-1 w-full px-3 py-2 bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-sm text-slate-800 dark:text-slate-200">
                    </div>
                    <div>
                        <label for="regex-input" class="text-sm font-medium text-slate-600 dark:text-slate-300">Expressão Regular (Regex)</label>
                        <textarea id="regex-input" rows="3" placeholder="Ex: response_time=(\d+)" class="mt-1 w-full px-3 py-2 bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-sm font-mono text-slate-800 dark:text-slate-200"></textarea>
                        <p class="text-xs text-slate-500 mt-1">Use parênteses `()` para capturar o valor numérico da métrica.</p>
                    </div>
                    <div>
                        <label for="metric-type" class="text-sm font-medium text-slate-600 dark:text-slate-300">Tipo de Métrica</label>
                        <select id="metric-type" class="mt-1 w-full px-3 py-2 bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-sm text-slate-800 dark:text-slate-200">
                            <option value="gauge">Gauge (Valor Instantâneo)</option>
                            <option value="counter">Counter (Contador)</option>
                        </select>
                    </div>
                    <div class="flex gap-4">
                        <button id="test-regex-btn" class="flex-1 px-4 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-lg text-sm font-medium transition-colors">Testar Regex</button>
                        <button id="save-metric-btn" class="flex-1 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-medium transition-colors">Salvar Métrica</button>
                    </div>
                </div>
            </div>
            <!-- Card de Resultados do Teste -->
            <div id="regex-results" class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 min-h-[100px]">
                <p class="text-slate-500 dark:text-slate-400">Resultados do teste da regex aparecerão aqui.</p>
            </div>
        </div>

        <!-- Coluna de Visualização -->
        <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
            <h4 class="text-lg font-semibold text-slate-800 dark:text-slate-100 mb-4">Visualizar Métrica</h4>
            <select id="metric-visualize-select" class="w-full px-3 py-2 bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-sm text-slate-800 dark:text-slate-200 mb-4">
                <option value="">Selecione uma métrica...</option>
            </select>
            <div id="metric-stats" class="flex justify-around text-sm text-slate-600 dark:text-slate-300 mb-4 p-2 bg-slate-50 dark:bg-slate-900 rounded-lg">
                <!-- Stats serão inseridas aqui -->
            </div>
            <div class="h-80 relative">
                <canvas id="metric-chart"></canvas>
            </div>
        </div>
    </div>

    <!-- Tabela de Métricas Salvas -->
    <div class="mt-6 bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700">
        <h4 class="text-lg font-semibold text-slate-800 dark:text-slate-100 mb-4">Métricas Salvas</h4>
        <div class="overflow-x-auto">
            <table id="metrics-table" class="w-full text-sm text-left text-slate-600 dark:text-slate-300">
                <thead class="text-xs text-slate-700 dark:text-slate-400 uppercase bg-slate-50 dark:bg-slate-700">
                    <tr><th class="px-4 py-2">Nome</th><th class="px-4 py-2">Regex</th><th class="px-4 py-2">Tipo</th><th class="px-4 py-2">Ação</th></tr>
                </thead>
                <tbody class="divide-y divide-slate-100 dark:divide-slate-700"></tbody>
            </table>
        </div>
    </div>
</div>
