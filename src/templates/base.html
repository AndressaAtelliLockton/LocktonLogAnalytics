<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lockton Analytics</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- jQuery & DataTables -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/output.css">
</head>
<body class="bg-gray-100 font-sans">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-slate-900 text-white flex flex-col">
            <div class="p-4 flex items-center gap-2 border-b border-slate-700">
                <span class="font-bold text-xl">Lockton Analytics</span>
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <a href="/" class="flex items-center gap-3 px-4 py-3 bg-slate-800 rounded-lg text-blue-400">
                    <i data-lucide="layout-dashboard"></i> Visão Executiva
                </a>
                <a href="/investigation" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 rounded-lg text-gray-300 transition">
                    <i data-lucide="search"></i> Investigação
                </a>
            </nav>
            <div class="p-4 border-t border-slate-700">
                <button id="btn-load-data" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded flex items-center justify-center gap-2 transition">
                    <i data-lucide="refresh-cw"></i> Carregar Dados
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col overflow-hidden">
            <header class="bg-white shadow-sm p-4 flex justify-between items-center">
                <h1 class="text-xl font-semibold text-gray-800">{% block title %}Dashboard{% endblock %}</h1>
                <div id="status-indicator" class="text-sm text-gray-500">
                    Aguardando dados...
                </div>
            </header>
            <div class="flex-1 overflow-auto p-6">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <script src="/static/js/main.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>
